[workspace]
resolver = "2"
members = [
    "lancer-jadx",
    "jadx-cli",
    "jadx-core",
    "jadx-dex",
    "jadx-resources",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-jadx"

[workspace.dependencies]
# Shared third-party crates (pinned at workspace level for consistency)
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
regex = "1"
aho-corasick = "1"
petgraph = "0.6"
rayon = "1"
sha1 = "0.10"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

# In-tree crates
jadx-core = { path = "jadx-core" }
jadx-dex = { path = "jadx-dex" }
jadx-resources = { path = "jadx-resources" }
jadx-cli = { path = "jadx-cli" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
